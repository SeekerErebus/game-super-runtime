[package]
name = "game-super-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Declarative Linux game launches, Steam runtimes, and companion applications"
license = "MIT"
readme = "README.md"
keywords = ["linux", "gaming", "steam", "proton", "launcher"]
categories = ["command-line-utilities", "games"]
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "docs/**", "examples/**"]

[dependencies]
anyhow = "1.0.100"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
shlex = "1.3.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[[bin]]
name = "game-super-runtime"
path = "src/main.rs"
